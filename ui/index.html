<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLUTO v2</title>
    <meta name="description" content="PLUTO v2 – Voice‑enabled research assistant" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind config – enable dark mode via class
      tailwind.config = {
        darkMode: ['class', '[data-theme="dark"]'],
        theme: {
          extend: {
            colors: {
              primary: '#4F46E5',
              surface: '#F8FAFC',
              'text-primary': '#0F172A',
              'text-secondary': '#64748B',
              border: '#E2E8F0',
              success: '#22C55E',
              warning: '#F59E0B',
              danger: '#EF4444',
            },
          },
        },
      };
    </script>
    <style>
      body {font-family: 'Inter', sans-serif;}
    </style>
  </head>
  <body class="bg-surface text-text-primary" data-theme="light">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 bg-white border-r border-border flex flex-col">
        <div class="flex items-center h-16 px-4 border-b border-border">
          <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
            <span class="text-lg font-semibold text-text-primary">PLUTO v2</span>
          </div>
        </div>
        <nav class="flex-1 py-4 space-y-1">
          <button class="w-full flex items-center gap-2 px-4 py-2 text-left text-sm font-medium rounded-md hover:bg-surface hover:text-primary" data-tab="chat">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h12a2 2 0 012 2v10z"/></svg>
            Chat
          </button>
          <button class="w-full flex items-center gap-2 px-4 py-2 text-left text-sm font-medium rounded-md hover:bg-surface hover:text-primary" data-tab="research">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16h8M8 12h8m-6-4h6"/></svg>
            Research
          </button>
          <button class="w-full flex items-center gap-2 px-4 py-2 text-left text-sm font-medium rounded-md hover:bg-surface hover:text-primary" data-tab="reports">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M9 8h6"/></svg>
            Reports
          </button>
        </nav>
        <div class="p-4 border-t border-border text-xs text-text-secondary">
          <span id="statusDot" class="inline-block w-2 h-2 rounded-full bg-success mr-1"></span>
          <span id="statusText">Online</span>
        </div>
      </aside>
      <!-- Main content -->
      <main class="flex-1 flex flex-col bg-surface">
        <!-- Header -->
        <header class="h-14 flex items-center px-6 border-b border-border bg-white">
          <h1 class="text-lg font-semibold text-text-primary">Research Chat</h1>
          <p class="ml-2 text-sm text-text-secondary">Ask anything – PLUTO will search for answers</p>
        </header>
        <!-- Chat area -->
        <section id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-4">
          <!-- Example message -->
          <div class="flex items-start gap-3">
            <div class="flex-shrink-0 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-white text-sm font-medium">P</div>
            <div class="bg-white rounded-lg p-3 shadow-sm max-w-2/3">
              <p class="text-text-primary">Hello! I'm PLUTO v2. How can I help you today?</p>
            </div>
          </div>
        </section>
        <!-- Input -->
        <footer class="flex items-center gap-2 p-4 border-t border-border bg-white">
          <textarea id="queryInput" rows="1" class="flex-1 rounded-md border border-border p-2 focus:outline-none focus:border-primary resize-none" placeholder="Ask a research question…"></textarea>
          <button id="sendBtn" class="flex items-center gap-1 bg-primary text-white px-4 py-2 rounded-md hover:bg-primary/80 disabled:opacity-50" disabled>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            Send
          </button>
        </footer>
      </main>
    </div>
    <script>
      // Simple client logic – send query to /process and display answer/audio
      const queryInput = document.getElementById('queryInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatArea = document.getElementById('chatArea');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      async function fetchStatus() {
        try {
          const resp = await fetch('/status');
          const data = await resp.json();
          if (data.online) {
            statusDot.className = 'inline-block w-2 h-2 rounded-full bg-success mr-1';
            statusText.textContent = 'Online';
          } else {
            statusDot.className = 'inline-block w-2 h-2 rounded-full bg-danger mr-1';
            statusText.textContent = 'Offline';
          }
        } catch (_) { /* ignore */ }
      }

      async function sendQuery() {
        const q = queryInput.value.trim();
        if (!q) return;
        addMessage('user', q);
        queryInput.value = '';
        sendBtn.disabled = true;
        try {
          const resp = await fetch('/process', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: q}),
          });
          const {answer, audio_uri} = await resp.json();
          addMessage('assistant', answer);
          if (audio_uri) {
            const audio = new Audio(audio_uri);
            audio.play();
          }
        } catch (e) {
          addMessage('assistant', 'Error processing request.');
        } finally {
          sendBtn.disabled = false;
          queryInput.focus();
        }
      }

      function addMessage(role, text) {
        const msgEl = document.createElement('div');
        msgEl.className = role === 'assistant' ? 'flex items-start gap-3' : 'flex items-start gap-3 justify-end';
        const avatar = document.createElement('div');
        avatar.className = role === 'assistant' ? 'flex-shrink-0 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-white text-sm font-medium' : 'flex-shrink-0 w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white text-sm font-medium';
        avatar.textContent = role === 'assistant' ? 'P' : 'U';
        const bubble = document.createElement('div');
        bubble.className = 'bg-white rounded-lg p-3 shadow-sm max-w-2/3';
        const p = document.createElement('p');
        p.className = 'text-text-primary';
        p.textContent = text;
        bubble.appendChild(p);
        if (role === 'assistant') {
          msgEl.appendChild(avatar);
          msgEl.appendChild(bubble);
        } else {
          msgEl.appendChild(bubble);
          msgEl.appendChild(avatar);
        }
        chatArea.appendChild(msgEl);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      queryInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQuery();
        }
      });
      sendBtn.addEventListener('click', sendQuery);

      // Initial status poll
      fetchStatus();
      setInterval(fetchStatus, 30000);
    </script>
  </body>
</html>
